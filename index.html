  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #12131c;
      /* 첫 화면은 상단바 48 + 캔버스 + 하단바 48로 정확히 채워져 스크롤이 없다 */
      overflow-x: hidden;
      overscroll-behavior: none; /* 모바일 당겨서 새로고침·바운스 차단 — 드래그 조작(핀볼 등) 중 이탈 방지 */
    }
    /* 레터박스(넓은 화면비의 캔버스 밖 영역): 빈 검은 띠 대신 은은한 비네트 —
       캔버스(#12131c)보다 살짝 어둡게 해 잼잼 영역이 무대처럼 떠 보인다 */
    body {
      background: radial-gradient(120% 90% at 50% 40%, #171827 0%, #0d0e16 70%, #0a0b11 100%);
      /* 플렉스 컬럼 — 블록 사이 공백 텍스트 노드가 줄 박스(27px)를 만들어 바 사이에 빈틈이
         생기고 하단바가 화면 밖으로 밀리던 문제를 없앤다(플렉스는 공백 노드를 무시). */
      display: flex; flex-direction: column; min-height: 100dvh;
    }
    .site-top, #game, .site-bottom { flex: none; }
    /* 상단 사이트 헤더 — 첫 화면에 항상 보이는 사이트 이름·설명·안내 링크.
       전면 캔버스만 보이던 첫 인상을 "사이트 안의 도구"로 바꾸고, 크롤러·방문자 모두에게
       사이트 구조를 즉시 드러낸다. 좁은 화면에서는 가로 스크롤로 링크를 모두 유지한다. */
    .site-top {
      /* 테두리 포함 정확히 48px — #game의 calc(100dvh - 96px)와 합이 딱 맞아야 띠가 화면 안에 남는다 */
      box-sizing: border-box;
      display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px;
      background: #0f1018; border-bottom: 1px solid #23263a;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      white-space: nowrap; overflow-x: auto; scrollbar-width: none;
    }
    .site-top::-webkit-scrollbar { display: none; }
    .site-top .brand {
      flex: none; color: #f2f3f7; font-family: 'Segoe UI', sans-serif;
      font-size: 17px; font-weight: bold; letter-spacing: 1px;
    }
    .site-top .desc { flex: none; color: #5a6078; font-size: 12px; }
    /* align-self: stretch 로 nav가 헤더 높이를 채워야 그 안의 링크도 48px 터치 타깃이 된다 */
    .site-top nav { display: flex; flex: none; align-self: stretch; margin-left: auto; gap: 10px; }
    .site-top nav a {
      display: flex; align-items: center; align-self: stretch; /* 터치 타깃 = 헤더 높이 48px */
      color: #8b90a8; font-size: 13px; text-decoration: none; padding: 0 3px;
    }
    .site-top nav a:hover { color: #6cc7ff; }
    @media (max-width: 620px) {
      .site-top { gap: 8px; padding: 0 10px; }
      .site-top .desc { display: none; }
      .site-top nav { margin-left: 8px; gap: 8px; }
      .site-bottom .long { display: none; }
    }
    /* 100vh는 모바일에서 하단 툴바 뒤 영역까지 포함해 캔버스가 잘림 — dvh로 실제 보이는 높이 사용.
       위아래 고정 바 48px씩 = 96px를 덜어내면 첫 화면이 스크롤 없이 정확히 채워진다. */
    #game {
      width: 100vw; height: calc(100vh - 96px); height: calc(100dvh - 96px);
      /* 캔버스 롱프레스 돋보기(iOS)·드래그 선택(PC) 방지 — 입력 필드는 아래에서 예외 */
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      /* 더블탭 줌 차단 — viewport의 user-scalable=no는 iOS가 무시한다.
         캔버스는 Phaser가 처리하지만 DOM 오버레이(입력창·버튼)는 이 선언이 필요(더블탭이 1급 조작인 씬 보호) */
      touch-action: manipulation;
    }
    /* touch-callout도 함께 복원 — 없으면 iOS에서 입력 필드 길게 눌러 붙여넣기가 차단된다(명단 붙여넣기 동선) */
    #game input, #game textarea {
      -webkit-user-select: text; user-select: text;
      -webkit-touch-callout: default;
    }
    canvas { display: block; }
    /* 하단 고정 바 — 전 페이지 공통(정적 페이지는 site.css가 같은 모양을 제공) */
    .site-bottom {
      box-sizing: border-box;
      display: flex; align-items: center; justify-content: center; height: 48px; padding: 0 14px;
      background: #0f1018; border-top: 1px solid #23263a;
      color: #6b7086; font-size: 12px; text-align: center;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    }
  </style>
